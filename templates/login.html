<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Jornada Académica 2025</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    min-height:100vh;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:450px;
}

.logo-box{
    display:flex;
    justify-content:center;
    margin-bottom:30px;
}

.logo{
    width:90px;
    height:90px;
    border-radius:20px;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    color:white;
    gap:4px;
}

.logo span:last-child{
    color:#00a000;
}

.title{
    text-align:center;
    margin-bottom:30px;
}

.title h1{
    font-size:32px;
    color:#111;
    margin-bottom:10px;
}

.title p{
    color:#666;
    font-size:15px;
}

.login-card{
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.06);
    border:1px solid #eee;
}

.form-group{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:10px;
    font-size:13px;
    font-weight:bold;
    color:#444;
    text-transform:uppercase;
    letter-spacing:1px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#f1f1f1;
    font-size:14px;
    outline:none;
}

input:focus{
    border:2px solid #008000;
    background:white;
}

.login-btn{
    width:100%;
    border:none;
    background:#008000;
    color:white;
    padding:16px;
    border-radius:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.login-btn:hover{
    background:#006d00;
}

.cancel-area{
    text-align:center;
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #eee;
}

.cancel-btn{
    display:inline-block;
    padding:12px 30px;
    background:#eaf8ea;
    color:#006d00;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
}

.footer{
    text-align:center;
    margin-top:30px;
    font-size:12px;
    color:#777;
    text-transform:uppercase;
    letter-spacing:1px;
}
</style>
</head>
<body>

<div class="container">

    <div class="logo-box">
        <div class="logo">
            12 <span>va</span>
        </div>
    </div>

    <div class="title">
        <h1>Te damos la bienvenida</h1>
        <p>Accede a la plataforma de gestión académica</p>
    </div>

    <div class="login-card">

        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-group">
                <label>Correo</label>
                <input 
                    type="email" 
                    name="email"
                    placeholder="nombre@institucion.edu"
                    required
                >
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input 
                    type="password" 
                    name="password"
                    placeholder="••••••••"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Iniciar sesión →
            </button>

        </form>

        <div class="cancel-area">
            <a href="{{ url_for('index') }}" class="cancel-btn">
                Cancelar
            </a>
        </div>

    </div>

    <div class="footer">
        © 2025 12va Jornada Académica y Cultural
    </div>

</div>

</body>
</html>
