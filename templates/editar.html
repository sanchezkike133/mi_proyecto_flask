<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Actividad</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#f4f7f5;
    padding:40px;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
}

.header{
    margin-bottom:30px;
}

.header h1{
    font-size:36px;
    color:#0a7d00;
}

.header p{
    color:#666;
    margin-top:8px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
    color:#333;
}

input, textarea{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ddd;
    background:#fafafa;
    margin-bottom:18px;
}

textarea{
    resize:none;
}

/* SIDE CARD */
.mini-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.mini-group{
    margin-bottom:18px;
}

.mini-group input{
    border:none;
    background:transparent;
    font-weight:bold;
}

/* BOTONES */
.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.save{
    background:#0a7d00;
    color:white;
}

.save:hover{
    background:#086600;
}

.cancel{
    background:#ddd;
}

.cancel:hover{
    background:#ccc;
}

/* RESPONSIVE */
@media(max-width:768px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Editar actividad</h1>
        <p>Modifica los detalles de la actividad</p>
    </div>

    <form method="POST">

        <div class="grid">

            <!-- IZQUIERDA -->
            <div class="card">

                <label>Nombre de la actividad</label>
                <input type="text" name="title" value="{{ actividad.title }}">

                <label>Ponente</label>
                <input type="text" name="speaker" value="{{ actividad.speaker }}">

                <label>Fecha</label>
                <input type="text" name="date" value="{{ actividad.date }}">

                <label>Descripción</label>
                <textarea name="description" rows="5">{{ actividad.description }}</textarea>

            </div>

            <!-- DERECHA -->
            <div>

                <div class="mini-card">

                    <div class="mini-group">
                        <label>Sede</label>
                        <input type="text" name="venue" value="{{ actividad.venue }}">
                    </div>

                    <div class="mini-group">
                        <label>Hora inicio</label>
                        <input type="text" name="start_time" value="{{ actividad.start_time }}">
                    </div>

                    <div class="mini-group">
                        <label>Hora fin</label>
                        <input type="text" name="end_time" value="{{ actividad.end_time }}">
                    </div>

                </div>

                <div class="mini-card">

                    <button type="submit" class="btn save">
                        Guardar cambios
                    </button>

                    <button type="button" onclick="window.location.href='{{ url_for('dashboard') }}'" class="btn cancel">
                        Cancelar
                    </button>

                </div>

            </div>

        </div>

    </form>

</div>

</body>
</html>
