<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agregar Nueva Actividad</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
}

.header{
    margin-bottom:30px;
}

.header p{
    color:#0a7d00;
    font-weight:bold;
    margin-bottom:10px;
    text-transform:uppercase;
    font-size:14px;
}

.header h1{
    font-size:38px;
    color:#111;
    margin-bottom:10px;
}

.header span{
    color:#666;
    line-height:1.6;
}

.form-box{
    background:white;
    border-radius:24px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

.form-group{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#333;
}

input,
select,
textarea{
    width:100%;
    padding:14px 16px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:15px;
    outline:none;
    background:#fafafa;
}

textarea{
    resize:none;
}

.grid-2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.grid-3{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.upload-box{
    border:2px dashed #cfcfcf;
    border-radius:18px;
    padding:40px;
    text-align:center;
    background:#fafafa;
}

.upload-box p{
    font-weight:bold;
    margin-bottom:6px;
}

.upload-box span{
    font-size:13px;
    color:#666;
}

.actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    margin-top:10px;
}

.btn{
    padding:15px;
    border:none;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

.btn-save{
    background:#0a7d00;
    color:white;
}

.btn-save:hover{
    background:#086600;
}

.btn-cancel{
    background:white;
    border:1px solid #ddd;
}

.btn-cancel:hover{
    background:#f5f5f5;
}

@media(max-width:768px){

    .grid-2,
    .grid-3,
    .actions{
        grid-template-columns:1fr;
    }

}

</style>
</head>
<body>

<div class="container">

    <div class="header">

        <p>Administración de programa</p>

        <h1>Agregar nueva actividad</h1>

        <span>
            Complete el formulario para integrar una nueva actividad a la agenda de la Jornada Académica y Cultural.
        </span>

    </div>

    <div class="form-box">

        <form 
            method="POST" 
            action="{{ url_for('nueva_actividad') }}"
            enctype="multipart/form-data"
        >

            <!-- NOMBRE -->
            <div class="form-group">

                <label>Nombre de la actividad *</label>

                <input 
                    type="text" 
                    name="title" 
                    placeholder="Ej. Inteligencia Artificial en el Diseño"
                    required
                >

            </div>

            <!-- DÍA Y CATEGORÍA -->
            <div class="grid-2">

                <div class="form-group">

                    <label>Día *</label>

                    <select name="day" required>
                        <option>Lunes</option>
                        <option>Martes</option>
                        <option>Miércoles</option>
                        <option>Jueves</option>
                        <option>Viernes</option>
                    </select>

                </div>

                <div class="form-group">

                    <label>Categoría *</label>

                    <select name="category" required>
                        <option>Académico</option>
                        <option>Cultural</option>
                        <option>Talleres</option>
                    </select>

                </div>

            </div>

            <!-- FECHA -->
            <div class="grid-3">

                <div class="form-group">

                    <label>Fecha *</label>

                    <input 
                        type="date" 
                        name="date"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Hora inicio *</label>

                    <input 
                        type="time" 
                        name="start_time"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Hora fin</label>

                    <input 
                        type="time" 
                        name="end_time"
                    >

                </div>

            </div>

            <!-- PONENTE -->
            <div class="form-group">

                <label>Ponente / Responsable *</label>

                <input 
                    type="text" 
                    name="speaker"
                    placeholder="Nombre completo"
                    required
                >

            </div>

            <!-- DATOS EXTRA -->
            <div class="grid-2">

                <div class="form-group">

                    <label>Carrera</label>

                    <input 
                        type="text" 
                        name="career"
                        placeholder="Ej. Ingeniería en Sistemas"
                    >

                </div>

                <div class="form-group">

                    <label>Institución</label>

                    <input 
                        type="text" 
                        name="institution"
                        placeholder="Ej. UNAM"
                    >

                </div>

            </div>

            <div class="grid-2">

                <div class="form-group">

                    <label>Correo electrónico</label>

                    <input 
                        type="email" 
                        name="speaker_email"
                        placeholder="ejemplo@correo.com"
                    >

                </div>

                <div class="form-group">

                    <label>Teléfono</label>

                    <input 
                        type="text" 
                        name="speaker_phone"
                        placeholder="9991234567"
                    >

                </div>

            </div>

            <div class="grid-2">

                <div class="form-group">

                    <label>Grado académico</label>

                    <select name="academic_degree">

                        <option value="">Seleccionar</option>
                        <option>Licenciatura</option>
                        <option>Ingeniería</option>
                        <option>Maestría</option>
                        <option>Doctorado</option>
                        <option>Especialidad</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Especialidad</label>

                    <input 
                        type="text" 
                        name="specialty"
                        placeholder="Ej. Inteligencia Artificial"
                    >

                </div>

            </div>

            <div class="form-group">

                <label>Años de experiencia</label>

                <input 
                    type="text" 
                    name="experience"
                    placeholder="Ej. 10 años"
                >

            </div>

            <div class="form-group">

                <label>Redes sociales o sitio web</label>

                <input 
                    type="text" 
                    name="social"
                    placeholder="https://linkedin.com/in/ponente"
                >

            </div>

            <div class="form-group">

                <label>Biografía del ponente</label>

                <textarea 
                    name="bio"
                    rows="4"
                    placeholder="Descripción breve del ponente..."
                ></textarea>

            </div>

            <!-- SEDE -->
            <div class="form-group">

                <label>Sede / Auditorio *</label>

                <select name="venue" required>

                    <option value="">Seleccionar</option>
                    <option>Aula Magna</option>
                    <option>Auditorio Principal</option>
                    <option>Laboratorio 1</option>
                    <option>Laboratorio 2</option>
                    <option>Sala de Conferencias</option>

                </select>

            </div>

            <!-- DESCRIPCIÓN -->
            <div class="form-group">

                <label>Descripción de la actividad</label>

                <textarea 
                    name="description"
                    rows="5"
                    placeholder="Escribir..."
                ></textarea>

            </div>

            <!-- IMAGEN -->
            <div class="form-group">

                <label>Foto del ponente o portada</label>

                <div class="upload-box">

                    <!-- PREVIEW -->
                    <img
                        id="preview"
                        src="{{ url_for('static', filename='img/imagen2.png') }}"
                        alt="Vista previa"
                        style="
                            width:250px;
                            height:180px;
                            object-fit:cover;
                            border-radius:16px;
                            margin-bottom:20px;
                            border:1px solid #ddd;
                        "
                    >

                    <p>Subir foto</p>

                    <span>
                        Formatos: JPG, PNG (Máx. 2MB)
                    </span>

                    <br><br>

                    <input
                        type="file"
                        name="imagen"
                        id="imagen"
                        accept=".jpg,.jpeg,.png"
                        onchange="mostrarPreview(event)"
                    >

                </div>

            </div>

            <!-- BOTONES -->
            <div class="actions">

                <button type="submit" class="btn btn-save">
                    Guardar actividad
                </button>

                <button
                    type="button"
                    onclick="window.location.href='{{ url_for('dashboard') }}'"
                    class="btn btn-cancel"
                >
                    Cancelar
                </button>

            </div>

        </form>

    </div>

</div>

<script>

function mostrarPreview(event){

    const input = event.target;
    const preview = document.getElementById("preview");

    if(input.files && input.files[0]){

        const reader = new FileReader();

        reader.onload = function(e){
            preview.src = e.target.result;
        }

        reader.readAsDataURL(input.files[0]);
    }

}

</script>

</body>
</html>
