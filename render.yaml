services:
  - type: web
    name: mi-jornada-academica     # Cambia por un nombre único
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mi-jornada-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.12   # Ajusta a tu versión (3.10, 3.11, etc.)

databases:
  - name: mi-jornada-db
    plan: free