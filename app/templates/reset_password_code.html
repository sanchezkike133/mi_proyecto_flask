{% extends "base.html" %}

{% block title %}Restablecer contraseña - Estudiante{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4 p-lg-5">
            <div class="text-center mb-4">
                <i class="fas fa-lock fa-3x text-success mb-3"></i>
                <h2 class="fw-bold">Restablecer contraseña</h2>
                <p class="text-muted">Ingresa el código de verificación y tu nueva contraseña</p>
            </div>

            <form method="POST" action="{{ url_for('auth.reset_password_student') }}">
                <div class="mb-3">
                    <label for="code" class="form-label fw-semibold">Código de verificación</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-key"></i></span>
                        <input type="text" class="form-control" id="code" name="code" 
                               placeholder="6 dígitos" required maxlength="6" autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Nueva contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" 
                               required minlength="6">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-semibold">Confirmar contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-check-circle"></i></span>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                               required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                    <i class="fas fa-save"></i> Cambiar contraseña
                </button>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <p class="mb-0"><a href="{{ url_for('auth.login') }}" class="text-decoration-none">
                    <i class="fas fa-arrow-left"></i> Volver al inicio de sesión
                </a></p>
            </div>
        </div>
    </div>
</div>

<script>
    // Validación adicional en el cliente
    document.querySelector('form').addEventListener('submit', function(e) {
        const pwd = document.getElementById('password').value;
        const confirm = document.getElementById('confirm_password').value;
        if (pwd !== confirm) {
            e.preventDefault();
            alert('Las contraseñas no coinciden');
        } else if (pwd.length < 6) {
            e.preventDefault();
            alert('La contraseña debe tener al menos 6 caracteres');
        }
    });
</script>
{% endblock %}
