{% extends "base.html" %}

{% block title %}Página no encontrada - Jornada {{ current_jornada_year }}{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="error-page">
                <i class="fas fa-search fa-5x text-muted mb-4"></i>
                <h1 class="display-1 fw-bold text-success">404</h1>
                <h2 class="mb-3">Página no encontrada</h2>
                <p class="text-muted mb-4">Lo sentimos, la página que buscas no existe o ha sido movida.</p>
                <a href="{{ url_for('public.index') }}" class="btn btn-success btn-lg">
                    <i class="fas fa-home"></i> Volver al inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
