{% extends "base.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-body">
            <h2 class="card-title text-center">Restablecer contraseña</h2>
            <p class="text-muted text-center">Ingresa tu nueva contraseña</p>
            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                <div class="mb-3">
                    <label>Nueva contraseña</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Confirmar contraseña</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Actualizar contraseña</button>
            </form>
        </div>
    </div>
</div>

<script>
    // Validación básica en cliente
    document.querySelector('form').addEventListener('submit', function(e) {
        const pwd = document.querySelector('input[name="password"]').value;
        const confirm = document.querySelector('input[name="confirm_password"]').value;
        if (pwd !== confirm) {
            e.preventDefault();
            alert('Las contraseñas no coinciden');
        } else if (pwd.length < 6) {
            e.preventDefault();
            alert('La contraseña debe tener al menos 6 caracteres');
        }
    });
</script>
{% endblock %}
