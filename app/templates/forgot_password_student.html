{% extends "base.html" %}

{% block title %}Recuperar contraseña - Estudiantes{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4 p-lg-5">
            <div class="text-center mb-4">
                <i class="fas fa-key fa-3x text-success mb-3"></i>
                <h2 class="fw-bold">¿Olvidaste tu contraseña?</h2>
                <p class="text-muted">Ingresa tu matrícula y correo electrónico</p>
            </div>
            <form method="POST" action="{{ url_for('auth.forgot_password_student') }}">
                <div class="mb-3">
                    <label class="form-label">Matrícula</label>
                    <input type="text" name="student_id" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Enviar código</button>
            </form>
            <hr>
            <div class="text-center">
                <a href="{{ url_for('auth.login') }}">Volver al inicio de sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
