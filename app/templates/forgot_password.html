{% extends "base.html" %}

{% block title %}Recuperar contraseña - Administrador{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow border-0 rounded-4">
        <div class="card-body p-4 p-lg-5">
            <div class="text-center mb-4">
                <i class="fas fa-key fa-3x text-success mb-3"></i>
                <h2 class="fw-bold">Recuperar contraseña</h2>
                <p class="text-muted">Ingresa tu correo electrónico para restablecer la contraseña de administrador</p>
            </div>

            <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                <div class="mb-4">
                    <label for="email" class="form-label fw-semibold">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" 
                               placeholder="admin@ejemplo.com" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                    <i class="fas fa-paper-plane"></i> Enviar enlace de recuperación
                </button>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <p class="mb-2"><a href="{{ url_for('auth.login') }}" class="text-decoration-none">
                    <i class="fas fa-arrow-left"></i> Volver al inicio de sesión
                </a></p>
                <p class="mb-0 text-muted small">¿Estudiante? 
                    <a href="{{ url_for('auth.forgot_password_student') }}" class="text-decoration-none">Recupera tu acceso aquí</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
