{% extends "base.html" %}

{% block title %}Error interno - Jornada {{ current_jornada_year }}{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="error-page">
                <i class="fas fa-exclamation-triangle fa-5x text-warning mb-4"></i>
                <h1 class="display-1 fw-bold text-danger">500</h1>
                <h2 class="mb-3">Error interno del servidor</h2>
                <p class="text-muted mb-4">Algo salió mal. Por favor, intenta más tarde o contacta al administrador.</p>
                <a href="{{ url_for('public.index') }}" class="btn btn-success btn-lg">
                    <i class="fas fa-home"></i> Volver al inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
